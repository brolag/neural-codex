# neural-codex project config (local scope)
# Current keys: https://developers.openai.com/codex/config-reference/

# GPT-5.6 is the current frontier family. The alias routes to gpt-5.6-sol.
model = "gpt-5.6"
model_reasoning_effort = "medium"
model_reasoning_summary = "auto"
model_verbosity = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Fallback filenames if AGENTS.md is missing.
project_doc_fallback_filenames = ["TEAM_GUIDE.md", ".agents.md", "PROJECT_GUIDE.md"]
project_doc_max_bytes = 65536

[features]
hooks = true

[sandbox_workspace_write]
network_access = false

# MCP servers are examples. Add credentials through the shell, never here.
[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

# Hooks live in .codex/hooks.json. Review and trust them with /hooks.
