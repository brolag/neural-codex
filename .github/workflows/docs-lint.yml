name: Validate Plugin

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1" # Weekly Monday 14:00 UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run supported test suite
        run: python -m pytest -q
      - name: Validate plugin documentation
        run: ./scripts/doc-lint.sh
